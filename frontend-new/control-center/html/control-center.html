<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Center</title>

  <link rel="stylesheet" href="../css/control-center.css">
  <link rel="stylesheet" href="../../modules/session-gateway/css/session-gateway.css">
  <link rel="stylesheet" href="../../modules/admin-tracking/css/admin-tracking.css">
  <link rel="stylesheet" href="../../modules/broker-placeholder/css/broker-placeholder.css">
  <link rel="stylesheet" href="../../modules/runtime-status/css/runtime-status.css">
  <link rel="stylesheet" href="../../modules/autopick-status/css/autopick-status.css">
  <link rel="stylesheet" href="../../modules/testing-center/css/testing-center.css">
  <link rel="stylesheet" href="../../modules/broker-connectivity/css/broker-connectivity.css">
</head>

<body>
  <div class="cc-shell">
    <aside class="cc-sidebar" aria-label="Control Center sidebar">
      <section class="cc-brand">
        <div class="cc-mark">CC</div>
        <strong>Control Center</strong>
      </section>

      <section class="cc-sidebar-section">
        <p class="cc-section-label">ACCESS</p>
        <nav class="cc-access" aria-label="Access routes">
          <button type="button" data-access="admin"><span class="cc-access-icon">⌘</span><span>Administrator</span></button>
          <button type="button" data-access="binance"><span class="cc-access-icon">◈</span><span>Binance</span></button>
          <button type="button" data-access="ibkr"><span class="cc-access-icon">▣</span><span>IBKR</span></button>
        </nav>
      </section>

      <section class="cc-sidebar-section">
        <p class="cc-section-label">MODULES</p>
        <nav class="cc-nav module-nav" aria-label="Control center modules"></nav>
      </section>

      <section class="cc-session-card">
        <strong>ADMIN</strong>
        <span>operator.local</span>
        <p>Session active</p>
        <button type="button" id="cc-logout-button">Logout</button>
      </section>
    </aside>

    <main class="cc-main">
      <header class="cc-topbar">
        <div>
          <span>Operational Control Plane</span>
          <h1 id="active-module-title">Runtime Access</h1>
        </div>
        <button type="button" id="cc-refresh-button">⟳ Refresh Now</button>
      </header>

      <section id="active-module-root" class="cc-content"></section>
    </main>
  </div>

  <script src="../../shared/js/config.js"></script>
  <script src="../../shared/js/event-bus.js"></script>
  <script src="../../shared/js/runtime-store.js"></script>
  <script src="../../shared/js/session-store.js"></script>
  <script src="../../shared/js/api-client.js"></script>
  <script src="../../shared/js/request-runner.js"></script>

  <script src="../../modules/runtime-status/js/runtime-status.service.js"></script>
  <script src="../../modules/runtime-status/js/runtime-status.presenter.js"></script>
  <script src="../../modules/runtime-status/js/runtime-status.controller.js"></script>
  <script src="../../modules/runtime-status/js/runtime-status.module.js"></script>

  <script src="../../modules/autopick-status/js/autopick-status.service.js"></script>
  <script src="../../modules/autopick-status/js/autopick-status.presenter.js"></script>
  <script src="../../modules/autopick-status/js/autopick-status.controller.js"></script>
  <script src="../../modules/autopick-status/js/autopick-status.module.js"></script>

  <script src="../js/control-center.orchestrator.js"></script>

  <script src="../../modules/session-gateway/js/session-gateway.module.js"></script>
  <script src="../../modules/admin-tracking/js/admin-tracking.module.js"></script>
  <script src="../../modules/broker-placeholder/js/broker-placeholder.module.js"></script>
  <script src="../../modules/testing-center/js/testing-center.js"></script>
  <script src="../../modules/broker-connectivity/js/broker-connectivity.js"></script>

  <script src="../js/control-center.js"></script>
</body>
</html>
